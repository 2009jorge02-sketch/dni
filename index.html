<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foto con contador</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    .foto {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contador {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 18px;
      border-radius: 12px;
      background: rgb(0 0 0 / 65%);
      color: white;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <img class="foto" src="IMG_0624.jpeg" alt="">

  <div class="contador">
    <span id="segundos">60</span> s
  </div>

  <script>
    let segundos = 60;
    const numero = document.getElementById("segundos");

    const cuentaAtras = setInterval(() => {
      segundos--;
      numero.textContent = segundos;

      if (segundos === 0) {
        clearInterval(cuentaAtras);
      }
    }, 1000);
  </script>
</body>
</html>
